<html lang="tr">
<head>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* App Bar Header */
        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.8) 0%, rgba(15, 23, 42, 0) 100%);
        }

        .status-badge {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #f59e0b; /* Loading state */
        }

        .status-dot.ready { background-color: #10b981; }
        .status-dot.recording { background-color: #ef4444; animation: pulse 1s infinite; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* Viewport Canvas Container */
        .viewport {
            position: relative;
            flex: 1;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            overflow: hidden;
        }

        video, canvas {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Bottom Controls Bar */
        .controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 20;
            padding: 24px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: linear-gradient(0deg, rgba(15, 23, 42, 0.9) 0%, rgba(15, 23, 42, 0) 100%);
        }

        .btn-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-icon:active {
            transform: scale(0.92);
            background: rgba(51, 65, 85, 0.9);
        }

        .btn-shutter {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            border: 4px solid #fff;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            padding: 4px;
            transition: all 0.2s ease;
        }

        .btn-shutter-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #fff;
            transition: all 0.2s ease;
        }

        .btn-shutter.recording .btn-shutter-inner {
            background: #ef4444;
            border-radius: 8px;
            transform: scale(0.6);
        }

        /* Mode Selector Tab */
        .mode-selector {
            position: absolute;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(10px);
            padding: 4px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            gap: 4px;
        }

        .mode-btn {
            padding: 6px 16px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 600;
            background: transparent;
            color: #94a3b8;
            border: none;
            cursor: pointer;
        }

        .mode-btn.active {
            background: #3b82f6;
            color: #fff;
        }

        /* Toast Notifications */
        .toast {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #3b82f6;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .toast.show { opacity: 1; }
    </style>
</head>
